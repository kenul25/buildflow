name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BUILDFLOW_TEST_CONNECTION_STRING: Host=localhost;Database=postgres;Username=postgres;Password=integration-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/BuildFlow.Api/BuildFlow.Api.csproj
      - run: dotnet build backend/BuildFlow.Api/BuildFlow.Api.csproj --no-restore --configuration Release
      - run: dotnet restore tests/BuildFlow.Integration/BuildFlow.Integration.csproj
      - run: dotnet build tests/BuildFlow.Integration/BuildFlow.Integration.csproj --no-restore --configuration Release
      - run: dotnet tests/BuildFlow.Integration/bin/Release/net8.0/BuildFlow.Integration.dll
      - run: dotnet restore tests/BuildFlow.Api.Tests/BuildFlow.Api.Tests.csproj
      - name: Build backend test project
        id: backend-build
        run: dotnet build tests/BuildFlow.Api.Tests/BuildFlow.Api.Tests.csproj --no-restore --configuration Release
      - name: Run backend unit tests
        run: dotnet test tests/BuildFlow.Api.Tests/BuildFlow.Api.Tests.csproj --no-build --configuration Release --filter "Category=Unit" --logger "trx;LogFileName=unit.trx" --results-directory .artifacts/test-results/backend
      - name: Run backend API and PostgreSQL integration tests
        if: ${{ !cancelled() && steps.backend-build.outcome == 'success' }}
        run: dotnet test tests/BuildFlow.Api.Tests/BuildFlow.Api.Tests.csproj --no-build --configuration Release --filter "Category=Integration" --logger "trx;LogFileName=integration.trx" --results-directory .artifacts/test-results/backend
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: .artifacts/test-results/backend/*.trx
          include-hidden-files: true
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/buildflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/buildflow-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  planning-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/agentic-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Test Render deployment automation
        run: python -m unittest discover -s ../../scripts/tests -v

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API deployment image
        run: docker build --tag buildflow-api:ci backend/BuildFlow.Api
      - name: Build planning deployment image
        run: docker build --tag buildflow-agent:ci backend/agentic-ai

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/buildflow_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
